name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install
        run: uv sync --extra dev

      - name: Lint
        run: |
          uvx ruff check .
          uvx ruff format --check .

      # Diagrams are generated from Python. If the committed output is out of date, say so with
      # the file names rather than through a test failure somebody has to decode.
      - name: Diagrams
        run: uv run python -m tools.diagrams --check

      # A lesson notebook that does not load is a lesson nobody can do.
      - name: Notebooks
        run: uvx --from marimo marimo check --strict lessons/*/notebook.py

      - name: Test
        run: uv run python -m pytest

  prose:
    name: prose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The house style rules, from tools/lintprose. This job has no dependencies
      # on purpose, so a prose only change gets an answer in a few seconds.
      - name: House style
        run: python3 -m tools.lintprose README.md CONTRIBUTING.md LAYOUT.md lessons blueprints corpora

      # Every claim a lesson makes has to name the evidence behind it, and the evidence has to
      # exist and be allowed to count. Standard library only, so it runs here with the prose.
      - name: Claim ledger
        run: python3 -m tools.claimledger

      # The blueprint shape, and the seal on every generated section.
      - name: Blueprints
        run: python3 -m tools.bpc
