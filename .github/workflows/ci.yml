name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # Named rather than taken from whatever the runner image happens to ship, because the test
      # runner's handling of its arguments has changed between versions.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install
        run: uv sync --extra dev

      - name: Lint
        run: |
          uvx ruff check .
          uvx ruff format --check .

      # Diagrams are generated from Python. If the committed output is out of date, say so with
      # the file names rather than through a test failure somebody has to decode.
      - name: Diagrams
        run: uv run python -m tools.diagrams --check

      # The notebook a reader opens from a Colab badge is committed, and it is generated from the
      # build.py beside it. This is what stops the two from drifting apart.
      - name: Notebooks
        run: uv run python -m tools.nbbuild --check

      # How much of every committed artefact the parsers understand. The number that matters is
      # not the unparsed one, which fails loudly anyway. It is a line sliding from read to skipped,
      # which is what a regular expression that stopped matching looks like from outside: no error,
      # no exception, and a lesson quietly showing the reader less than it did last week.
      - name: Parser baseline
        run: uv run python -m tools.baseline

      - name: Test
        run: uv run python -m pytest

      # The browser half of Tier 0. Node is here to run the tests and nothing else, and there are
      # no dependencies to install, so this costs a few seconds. What it is worth is the blocking
      # call across two real threads, which is the part of the design that is either true or not.
      - name: Browser half
        run: node --test tests/web/*.test.js

  prose:
    name: prose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The house style rules, from tools/lintprose. This job has no dependencies
      # on purpose, so a prose only change gets an answer in a few seconds.
      - name: House style
        run: python3 -m tools.lintprose README.md CONTRIBUTING.md LAYOUT.md lessons blueprints corpora kxbox site

      # Every claim a lesson makes has to name the evidence behind it, and the evidence has to
      # exist and be allowed to count. Standard library only, so it runs here with the prose.
      - name: Claim ledger
        run: python3 -m tools.claimledger

      # Every path this repository writes about, and every citation into the kernel. Catches a
      # file that moved and left the documents pointing at where it used to be.
      - name: References
        run: python3 -m tools.refcheck

      # The blueprint shape, the seal on every generated section, and a run of the generator to
      # check that what is committed is still what it produces. The second one is what catches an
      # edit that was resealed afterwards, which the seal on its own cannot.
      - name: Blueprints
        run: python3 -m tools.bpc

      # Every Tier 0 recipe names a capture. This fails when one of them points at a file that
      # nobody committed, which would otherwise be a lesson cell that works for the person who
      # wrote it and breaks for the reader.
      - name: Tier 0 recordings
        run: python3 -m kxbox --check

      # The pinned kernel, and whether every config profile still has what the book depends on.
      # Reads text files, so it belongs here with the prose rather than in the build job.
      - name: Kernel config
        run: python3 -m tools.kconfig

      # Every animation storyboard: the ninety second budget, the captions, the alt text, and
      # whether the still it names is really on disk. Standard library only, and no manim, which
      # is the point. The rules run on every push and the renderer does not have to.
      - name: Storyboards
        run: python3 -m kxmanim

      # The navigation and the site stylesheet are generated from what is on disk. This catches a
      # lesson that was added without being wired into the book, which would otherwise be a page
      # nobody can reach and nobody would notice.
      - name: Site
        run: python3 -m tools.sitebuild --check

  # The book itself, in a job of its own because the theme and the notebook renderer are a slow
  # install and most pushes do not touch either. Strict, so a link that points at nothing fails.
  site:
    name: site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install
        run: uv sync --extra site

      - name: Stage
        run: uv run python -m tools.sitebuild

      - name: Build
        run: cd site && uv run mkdocs build --strict
