schema = 1

# Citations for the lock ordering blueprint.
#
# Every sentence in `lock-ordering.md` that states something about Linux points at one of these by
# writing its id in square brackets, and `refcheck` fails the build on a marker with no entry here
# and on an entry nothing points at.
#
# These are confirmed against the pinned tree. Confirming one means running:
#
#     ./kxbox/kernel/tree.sh
#     python3 -m tools.refcheck --tree kxbox/kernel/build/tree/linux-7.2.2 --confirm
#
# which finds the anchor, writes down the line it landed on and flips the flag. The tree that gets
# unpacked is the pristine tarball from kernel.org, checked against the same sha256 the build
# checks.
#
# The anchor is a piece of text to find, never a line number. The line numbers below are output
# rather than input, and running the command again after a version bump is what finds the ones
# that moved.
#
# Two things about this set are worth knowing before reading it. Nearly all of it is one file,
# `kernel/locking/lockdep.c`, which is close to seven thousand lines and is the whole mechanism
# apart from the type definitions and the `/proc` file. And a large number of the anchors below
# are comments rather than code, which is unusual for this project and is deliberate here: the
# comments in this file state the rules the code enforces, several of them are the only written
# statement of a rule anywhere, and a comment that gets deleted is exactly the change a reader of
# this blueprint would want to know about.

