schema = 1

# Citations for the page fault blueprint.
#
# Every sentence in `page-fault.md` that states something about Linux points at one of these by
# writing its id in square brackets, and `refcheck` fails the build on a marker with no entry here
# and on an entry nothing points at.
#
# These are confirmed against the pinned tree. Confirming one means running:
#
#     ./kxbox/kernel/tree.sh
#     python3 -m tools.refcheck --tree kxbox/kernel/build/tree/linux-7.2.2 --confirm
#
# which finds the anchor, writes down the line it landed on and flips the flag. The tree that gets
# unpacked is the pristine tarball from kernel.org, checked against the same sha256 the build
# checks, so a citation here resolves against the same source everybody else gets rather than
# against something a build left behind.
#
# The anchor is a piece of text to find, never a line number. A line number is right on the day it
# is typed and wrong after the next patch, and the wrongness is silent, because a stale line number
# still points at a line. The line numbers below are output rather than input, and running the
# command again after a version bump is what finds the ones that moved.
#
# An anchor that matches more than one line is rejected. That rule did most of the work here. The
# first run had twenty one problems in it, and nearly all of them were a bare function name that
# also appears at its call site or in a forward declaration.

[[references]]
id = "page-fault-R1"
path = "arch/x86/mm/fault.c"
anchor = "DEFINE_IDTENTRY_RAW_ERRORCODE(exc_page_fault)"
kernel = "7.2.2"
confirmed = true
line = 1492
note = "The architecture entry point. Everything in this blueprint starts here on x86-64, and the macro is what wires it to vector 14 in the interrupt descriptor table."

