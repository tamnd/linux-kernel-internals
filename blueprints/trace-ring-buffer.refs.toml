schema = 1

# Citations for the trace ring buffer blueprint.
#
# Every sentence in `trace-ring-buffer.md` that states something about Linux points at one of these
# by writing its id in square brackets, and `refcheck` fails the build on a marker with no entry
# here and on an entry nothing points at.
#
# These are confirmed against the pinned tree. Confirming one means running:
#
#     ./kxbox/kernel/tree.sh
#     python3 -m tools.refcheck --tree kxbox/kernel/build/tree/linux-7.2.2 --confirm
#
# which finds the anchor, writes down the line it landed on and flips the flag. The tree that gets
# unpacked is the pristine tarball from kernel.org, checked against the same sha256 the build
# checks.
#
# The anchor is a piece of text to find, never a line number. The line numbers below are output
# rather than input, and running the command again after a version bump is what finds the ones
# that moved.
#
# Two notes on this set. Most of it is one file, `kernel/trace/ring_buffer.c`, which is a little
# over eight thousand lines and holds the whole mechanism apart from the `/proc` style files that
# print its counters. And several anchors are the long comments in that file rather than the code
# under them, because this is a lockless algorithm whose correctness argument is written in prose
# and nowhere else. Deleting one of those comments is exactly the change a reader of this
# blueprint would want to hear about.

