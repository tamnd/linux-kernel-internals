# Citations for the write path blueprint.
#
# Every sentence in `write-path.md` that states something about Linux points at one of these by
# writing its id in square brackets, and `refcheck` fails the build on a marker with no entry here
# and on an entry nothing points at.
#
# These are confirmed against the pinned tree. Confirming one means running:
#
#     ./kxbox/kernel/tree.sh
#     python3 -m tools.refcheck --tree kxbox/kernel/build/tree/linux-7.2.2 --confirm
#
# which finds the anchor, writes down the line it landed on and flips the flag. The tree that gets
# unpacked is the pristine tarball from kernel.org, checked against the same sha256 the build
# checks.
#
# The anchor is a piece of text to find, never a line number. The line numbers below are output
# rather than input, and running the command again after a version bump is what finds the ones
# that moved.
#
# Two things about this set are worth knowing before reading it. The write path is spread across
# four files that do not obviously belong together, and half the surprises in this blueprint come
# from that: `fs/read_write.c` is the system call, `mm/filemap.c` is the loop that does the work,
# `mm/page-writeback.c` is the throttle, and the filesystem in the middle is `mm/shmem.c` here and
# something else on any other machine. The second thing is that several anchors below are a
# statement inside a function rather than a function signature, because the interesting decisions
# in this path are single lines in the middle of long functions.

[[references]]
id = "write-path-R1"
path = "fs/read_write.c"
anchor = "SYSCALL_DEFINE3(write, unsigned int, fd,"
kernel = "7.2.2"
confirmed = true
line = 747
note = "The system call itself. Three arguments, and the return value is a count of bytes rather than a success flag, which is the fact that makes short writes possible and makes ignoring the return value a bug."

[[references]]
id = "write-path-R2"
path = "fs/read_write.c"
anchor = "ssize_t ksys_write(unsigned int fd"
kernel = "7.2.2"
confirmed = true
line = 728
note = "The descriptor lookup and the file position handling, which is everything the system call does that is about the process rather than about the file."

[[references]]
id = "write-path-R3"
