path = "fs/read_write.c"
anchor = "int rw_verify_area(int read_write, struct file *file"
kernel = "7.2.2"
confirmed = true
line = 453
note = "The position and count checks, plus the two hooks that let something outside the filesystem refuse a write: the security modules and the file notification machinery."

# There is no entry for the line that applies the cap, and that is worth explaining rather than
# leaving as a gap. The line is `if (count > MAX_RW_COUNT)` inside `vfs_write`, and the identical
# line appears in `vfs_read` and in `do_sendfile` as well, so an anchor for it would match three
# places in one file. The rule here is that an anchor matching more than once is rejected, because
# the first match wins and nobody finds out when the wrong one was picked. So the cap is cited by
# the function that applies it, R3, and by the value itself, R6.

[[references]]
id = "write-path-R6"
path = "include/linux/fs.h"
anchor = "#define MAX_RW_COUNT (INT_MAX & PAGE_MASK)"
kernel = "7.2.2"
confirmed = true
line = 2424
note = "What that limit is. A little under two gigabytes on a 32-bit build, rounded down to a page, and it is the same number on 64-bit because the return type is signed and 32 bits wide in the ABI."

