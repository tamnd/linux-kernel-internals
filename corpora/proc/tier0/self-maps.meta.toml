# Seven lines and four things in them.
#
# /bin/busybox appears twice, once r-xp and once rw-p, because a program's text and its data are
# one file mapped two ways with different permissions. That is not a quirk of busybox, it is what
# every dynamically linked program on every Linux machine looks like.
#
# Line three has no name. That is anonymous memory, and it is what a first write has to go and find
# a page for, which is the whole subject of blueprints/page-fault.md.
#
# Line three also ends in a space. The kernel pads every line out to a fixed column before printing
# the path, and when there is no path the padding is still there, so the line has five whitespace
# separated fields and every other line has six. Code that reaches for field six works until it
# meets this line. Do not let an editor strip the trailing whitespace from this file.
#
# The two gaps between the mappings are most of the address space. 0814c000 to b7f8f000 is about
# 2.7 GiB of nothing, and a fault anywhere in it is a segmentation fault.
