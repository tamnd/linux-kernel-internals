# The whole file, ninety nine lines, because it is the declaration of everything the memcheck
# profile turns on and there is nothing in it worth leaving out.
#
# Two things in here are worth knowing before setting any of these by hand.
#
# Six of the eight symbols sit inside `if KFENCE`, and five of those six have no `depends on` line
# of their own. Read a symbol without reading the block it is in and the answer to why it is off is
# missing. This file is why `kxray.source.kconfig` now reads `if` and `endif` rather than counting
# them as lines it did not understand, and `Symbol.conditions` is where the block condition and the
# symbol's own dependencies come back together.
#
# KFENCE_NUM_OBJECTS carries `range 1 65535`, which is the only place the kernel says out loud what
# that number is allowed to be. A fragment setting it to 0 would produce a .config that silently
# does not have the value in it.

symbols = 8
inside_the_if_block = 6
sample_interval_default = 100
num_objects_default = 255
num_objects_range = "1 65535"
