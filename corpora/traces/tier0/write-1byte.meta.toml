source = "tier0"
evidence = true

describes = "one byte written to a file nothing had written to before, from the write system call down to the page being allocated and the byte copied in"
tracer = "function_graph"
options = ["funcgraph-proc", "nofuncgraph-irqs"]

kernel = "7.2.2"
arch = "i386"
profile = "A-full"
uniprocessor = true
preempt = true
captured = "2026-09-02"
tier = 0

# How to take it again.
command = "/bin/writebyte --quiet"
setup = [
    "echo 0 > /sys/kernel/tracing/tracing_on",
    "echo function_graph > /sys/kernel/tracing/current_tracer",
    "echo funcgraph-proc > /sys/kernel/tracing/trace_options",
    "echo nofuncgraph-irqs > /sys/kernel/tracing/trace_options",
    "echo vfs_write > /sys/kernel/tracing/set_graph_function",
    "echo > /sys/kernel/tracing/trace",
]

# Four things about this capture that are not obvious from reading it.
#
# The command is a program in the image rather than a shell one liner, for the same reason
# `touchpage` exists. `dd if=/dev/zero of=/tmp/one bs=1 count=1` looks like one write and is not:
# the shell writes its prompt, dd writes two lines of summary, and busybox writes more on the way
# past. Filtering to `vfs_write` does not help, because every one of those is a `vfs_write` too.
# `writebyte` turns the tracer on around exactly one `write`, and opens the file before the window
# so no `open` lands in the trace.
#
# The file is one nothing had written to yet, on purpose. A first write has to find a page for the
# data and a second one finds it already there, and the first is the one worth drawing. That is
# what puts `shmem_alloc_and_add_folio` and `__folio_alloc_noprof` in here.
#
# The first line is a `mutex_unlock()` with no call above it. That is the tail of the `write` that
# turned tracing on, which was already several frames deep when recording started. Every trace has
# that shape at its start and it is left in rather than trimmed out.
#
# The last `vfs_write` is incomplete. It is the write that turned tracing off, and its closing
# brace was never going to be recorded because recording had stopped by then. That is the shape
# every trace has at its end.
#
# The durations are emulated. v86 has no real clock, so the order and the nesting are true and the
# times are not, and no claim rests on them. The cost of tracing is measured on a real machine
# instead, in ../../experiments/tier1/.
# `nofuncgraph-irqs` was added to this list after the file was captured, and the file was left
# alone rather than taken again. It keeps functions called from interrupt context out of the trace,
# there are none in here, and taking the capture again with it set reproduces this call sequence
# exactly. What it changes is that reproducing it no longer depends on no timer tick landing inside
# the window, which is what it depended on before and what nobody would have noticed until it did.
timings_are_real = false

# What the parser has to get right, and what the tests compare against.
unparsed_lines = 0
frames = 57
roots = 3
max_depth = 8
cpus = [0]
