source = "tier1"
evidence = true

describes = "six processes on six CPUs writing one byte each at the same moment, so the trace file holds six call stacks at once"
tracer = "function_graph"
options = ["funcgraph-proc", "funcgraph-cpu"]

kernel = "6.8.0-117-generic"
distribution = "Ubuntu 24.04"
arch = "aarch64"
uniprocessor = false
cpu_count = 6
captured = "2026-09-02"
tier = 1

# How to take it again. It needs a real Linux machine with more than one CPU, and root, because
# tracefs has to be mounted and written to. Tier 0 cannot produce this and never will: v86 is a
# uniprocessor emulator, so a Tier 0 trace has one CPU in it by construction.
#
# The machine here is a Linux virtual machine on a laptop, reached through a privileged container.
# `taskset` pins one writer to each CPU, and the writers spin on a file until it appears so that
# they start together rather than one after another. Without that barrier the six bursts do not
# overlap and the trace comes out sorted by CPU, which shows nothing.
command = "six taskset pinned dd processes released from a barrier, one byte written twice each"
setup = [
    "mount -t tracefs nodev /sys/kernel/tracing",
    "echo 0 > /sys/kernel/tracing/tracing_on",
    "echo function_graph > /sys/kernel/tracing/current_tracer",
    "echo funcgraph-proc > /sys/kernel/tracing/trace_options",
    "echo funcgraph-cpu > /sys/kernel/tracing/trace_options",
    "echo vfs_write > /sys/kernel/tracing/set_graph_function",
    "echo 3 > /sys/kernel/tracing/max_graph_depth",
    "echo > /sys/kernel/tracing/trace",
]

# Five things about this capture that are worth knowing.
#
# The target is on tmpfs, under /dev/shm, and that is deliberate. Writing anywhere else inside a
# container lands on overlayfs and the trace fills with `ovl_write_iter` and friends, which is a
# fact about containers rather than about writing. On tmpfs the path is `shmem_file_write_iter`,
# which is the same path the Tier 0 capture in ../tier0/write-1byte.txt takes, so the two traces
# can be read against each other.
#
# The depth is limited to 3. Six CPUs writing at full depth produces a few thousand lines, and the
# point of this file is the interleaving rather than the depth. ../tier0/write-1byte.txt is the
# deep one.
#
# The CPU column changes 33 times in 305 lines. Lines 187 to 206 are the part worth reading: CPU 2
# and CPU 4 alternate almost line by line while both are part way through their own `vfs_write`,
# so consecutive lines belong to different call stacks and the indentation jumps between them.
#
# There is a `lima-gu-1171` in here, which is nothing to do with the six writers. It is the
# virtual machine's own guest agent, caught writing while the tracer was on. A trace on a real
# machine has other people's work in it and there is no setting that removes that.
#
# There are `write_null()` calls under two of the writers. Those are dd writing its summary lines
# to /dev/null, which the command redirected them to. They are `vfs_write` too, which is the whole
# reason the Tier 0 capture uses a purpose built program instead of dd.
#
# The durations here are real. This is a real machine with a real clock, so unlike Tier 0 the
# numbers mean something, though it is a virtual machine on a busy laptop and they are noisy.
timings_are_real = true

# What the parser has to get right, and what the tests compare against.
unparsed_lines = 0
frames = 214
roots = 33
max_depth = 2
cpus = [0, 1, 2, 3, 4, 5]
