schema = 1

# The userland that comes up inside Tier 0, pinned the same way the kernel is.
#
# One statically linked busybox and nothing else. Static because a dynamic binary drags a C library
# into the image and the image is the thing a browser pays for twice, and because a rootfs with one
# file in it has one thing that can be wrong with it.
#
# This is an upstream prebuilt binary rather than one this project compiled. That is a deliberate
# trade and it is worth saying out loud: it saves a second cross toolchain and a second build, and
# it means the shell in the box is somebody else's build. The checksum below is what pins it. If
# this ever needs to become a real build, it lives here and nothing above it changes.

[busybox]
version = "1.35.0"
arch = "i686"
libc = "musl"
url = "https://busybox.net/downloads/binaries/1.35.0-i686-linux-musl/busybox"
sha256 = "27e409705b29937b9a6105038d9c2e3eb8dc3e2c8d606d22872dbde7f47c000f"
size_bytes = 1061344
recorded = "2026-09-02"

# The applets the bridge cannot work without. `build.sh` asks the binary for its list and stops if
# one of these is missing, because finding out from a shell that will not echo is much worse.
required_applets = [
    "sh",
    "cat",
    "printf",
    "base64",
    "mount",
    "mkdir",
    "ls",
    "dmesg",
    "insmod",
    "rmmod",
    "sleep",
    "sync",
]

# The things in the image that are not busybox. They are compiled here because no applet does one
# thing and stops: there is none that faults on a page you chose at a moment you chose, and none
# that writes one byte without writing several other things around it. Without them every trace of
# a page fault is thirty faults, and every trace of a write is nine writes, with the interesting
# one somewhere in the middle. The container is the same one the kernel is built in, so this adds
# no toolchain that was not already needed.
#
# The cross compiler is used on every host, including an x86 one where the native gcc could do it
# with -m32. One compiler means one binary, and a binary that differs depending on whose laptop
# built the image is a difference that turns up later as a trace nobody can reproduce.
#
# They share `tiny.h`, which is the syscall wrappers and the entry point a C library would have
# provided. Adding a program means adding one line to `sources` and one file beside it.
[programs]
sources = ["touchpage.c", "writebyte.c", "twowrites.c"]
image = "debian:trixie-slim"
compiler = "i686-linux-gnu-gcc"
packages = ["gcc-i686-linux-gnu"]
# No C library, so no libc headers to install and nothing to link against. `-nostdlib` is what
# takes the binary from seven hundred kilobytes to about ten, and the rootfs is a thing a browser
# downloads. `-fno-pic` because the syscall wrappers want ebx, which position independent code
# reserves for itself.
flags = ["-static", "-nostdlib", "-fno-pic", "-fno-stack-protector", "-Os", "-Wall", "-Wextra", "-Werror"]

# Kernel modules the image carries, if somebody has built them.
#
# These are optional in a way the programs above are not. A module is compiled against one profile
# of one kernel and refused by every other, because `vermagic` is a string built into it that
# carries the preemption model and a few other switches along with the version. So there is no one
# module that works in all of A-full, D-lockdep and whatever comes next, and an image that insisted
# on having one would be an image that only boots on a machine where somebody ran the kernel build.
#
# `kxbox/kernel/module.sh D-lockdep lessons/C09/assets` builds the one that is here now. This picks
# up whatever `.ko` files it finds and puts them where `insmod` can reach them. An image with none
# boots exactly the same, and the lesson that wants one falls back to the committed capture.
[modules]
look_in = ["lessons/C09/assets"]
into = "lib/modules"

