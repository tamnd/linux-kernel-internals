schema = 1

# The userland that comes up inside Tier 0, pinned the same way the kernel is.
#
# Everything in the image is statically linked. A dynamic binary drags a C library in beside it,
# and the image is the thing a browser pays for twice.
#
# The busybox below is an upstream prebuilt binary rather than one this project compiled. That is a
# deliberate trade and it is worth saying out loud: it saves a second cross toolchain and a second
# build, and it means the shell in the box is somebody else's build. The checksum is what pins it.
# If this ever needs to become a real build, it lives here and nothing above it changes.
#
# strace further down goes the other way and is built from source, for the plain reason that nobody
# publishes a static i686 one. The three programs after it are ours.

[busybox]
version = "1.35.0"
arch = "i686"
libc = "musl"
url = "https://busybox.net/downloads/binaries/1.35.0-i686-linux-musl/busybox"
sha256 = "27e409705b29937b9a6105038d9c2e3eb8dc3e2c8d606d22872dbde7f47c000f"
size_bytes = 1061344
recorded = "2026-09-02"

# The applets the bridge cannot work without. `build.sh` asks the binary for its list and stops if
# one of these is missing, because finding out from a shell that will not echo is much worse.
required_applets = [
    "sh",
    "cat",
    "printf",
    "base64",
    "mount",
    "mkdir",
    "ls",
    "dmesg",
    "insmod",
    "rmmod",
    "sleep",
    "sync",
]

# The things in the image that are not busybox. They are compiled here because no applet does one
# thing and stops: there is none that faults on a page you chose at a moment you chose, and none
# that writes one byte without writing several other things around it. Without them every trace of
# a page fault is thirty faults, and every trace of a write is nine writes, with the interesting
# one somewhere in the middle. The container is the same one the kernel is built in, so this adds
# no toolchain that was not already needed.
#
# The cross compiler is used on every host, including an x86 one where the native gcc could do it
# with -m32. One compiler means one binary, and a binary that differs depending on whose laptop
# built the image is a difference that turns up later as a trace nobody can reproduce.
#
# They share `tiny.h`, which is the syscall wrappers and the entry point a C library would have
# provided. Adding a program means adding one line to `sources` and one file beside it.
[programs]
sources = ["touchpage.c", "writebyte.c", "twowrites.c"]
image = "debian:trixie-slim"
compiler = "i686-linux-gnu-gcc"
packages = ["gcc-i686-linux-gnu"]
# No C library, so no libc headers to install and nothing to link against. `-nostdlib` is what
# takes the binary from seven hundred kilobytes to about ten, and the rootfs is a thing a browser
# downloads. `-fno-pic` because the syscall wrappers want ebx, which position independent code
# reserves for itself.
flags = ["-static", "-nostdlib", "-fno-pic", "-fno-stack-protector", "-Os", "-Wall", "-Wextra", "-Werror"]

# strace, which answers the one question the function graph tracer cannot answer at all.
#
# A tape says what the kernel did inside a call and how long each frame took. It does not say what
# the program asked for. The arguments, the file descriptors, the flags and the errno on the way
# back are not in a function graph trace and no amount of reading one recovers them, because the
# tracer records entry and exit and the values live in registers it does not sample. Those are the
# first questions a beginner has, they are the whole of the Tourist tier, and until now the box had
# no way to answer them.
#
# The two together are the point rather than either alone. `strace` on `writebyte` shows one
# `write` in the tracer window, which is the claim the three programs beside this file are built on
# and which nothing was checking. The tape shows what that one write turned into.
#
# Built from the release tarball, not downloaded as a binary, because nobody publishes a static
# i686 strace. That is the opposite trade from busybox above and it is made for a plain reason:
# there was nothing to download.
#
# It costs about a megabyte compressed, which more than doubles the image. Most of that is a static
# glibc plus the tables that turn a syscall number and six longs into a line somebody can read, and
# those tables are the entire feature. Building against musl would cut it and would mean a second
# cross toolchain, which is the trade `kernel/README.md` already refused once.
#
# `--enable-mpers=no` because mpers is for a 64 bit strace decoding a 32 bit process. This strace
# is 32 bit and there is one personality here, so the machinery has nothing to do. It is also the
# part of the build that needs the most from the toolchain, so turning it off removes the thing
# most likely to break on somebody else's machine.
#
# `configure` needs a native compiler as well as the cross one. It builds and runs a few small
# programs on the build host on its way to deciding things about the target, which is why `gcc` and
# `libc6-dev` are in the list next to their cross versions.
[strace]
version = "7.2"
url = "https://github.com/strace/strace/releases/download/v7.2/strace-7.2.tar.xz"
sha256 = "4bde6246926890dcee824f6e6ac42a06752f47d77e5097d86e3c0d6d4b709fe5"
size_bytes = 2810844
recorded = "2026-09-06"
image = "debian:trixie-slim"
packages = [
    "gcc",
    "gcc-i686-linux-gnu",
    "libc6-dev",
    "libc6-dev-i386-cross",
    "make",
    "xz-utils",
]
configure = ["--host=i686-linux-gnu", "--enable-mpers=no"]
strip = "i686-linux-gnu-strip"
# What the built binary comes to, stripped, so a build that suddenly produces something a long way
# from this has changed in a way somebody should look at.
built_bytes = 2446716

# Kernel modules the image carries, if somebody has built them.
#
# These are optional in a way the programs above are not. A module is compiled against one profile
# of one kernel and refused by every other, because `vermagic` is a string built into it that
# carries the preemption model and a few other switches along with the version. So there is no one
# module that works in all of A-full, D-lockdep and whatever comes next, and an image that insisted
# on having one would be an image that only boots on a machine where somebody ran the kernel build.
#
# `kxbox/kernel/module.sh D-lockdep lessons/C09/assets` builds the one that is here now. This picks
# up whatever `.ko` files it finds and puts them where `insmod` can reach them. An image with none
# boots exactly the same, and the lesson that wants one falls back to the committed capture.
[modules]
look_in = ["lessons/C09/assets"]
into = "lib/modules"

