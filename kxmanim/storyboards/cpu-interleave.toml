id = "cpu-interleave"
idea = "The trace file holds every CPU at once, so the indentation belongs to a CPU"
still = "lessons/Z02/assets/one-file-two-stacks.svg"
status = "draft"

# This used to be blocked on a capture from a machine with more than one CPU, because Tier 0 is a
# uniprocessor emulator and no setting changes that. That capture exists now. Six dd processes on
# a six CPU machine, one pinned to each, released from a barrier so their writes overlap. The CPU
# column changes 33 times in 305 lines, and the twenty lines this animation walks through are two
# of those CPUs alternating with both of them part way through their own call tree.
#
# The numbers in the captions are read out of that file rather than made up to look plausible.
inputs = ["corpora/traces/tier1/multi-cpu-write.txt"]
evidence = true

[[beat]]
seconds = 10
caption = "Here is a real trace file, twenty lines of it, in the order the kernel wrote them."
alt = "Twenty lines of function_graph output stacked in a single column, each one indented, with a number in the leftmost column that most readers skip straight past."
shows = ["trace-cell"]

[[beat]]
seconds = 12
caption = "Read it the obvious way and every line is nested inside the line above it."
alt = "A pointer follows the indentation down the column, joining each call to the one under it, drawing the single call stack a reader would naturally assume is there."
shows = ["trace-cell"]

[[beat]]
seconds = 10
caption = "It is not one stack. Look at the first column, which is the CPU number."
alt = "The leftmost column lights up on every line, reading two, four, two, two, four, four, and the single stack drawn in the last beat greys out behind it."
shows = ["trace-cell", "cpu-lane"]

[[beat]]
seconds = 14
caption = "The lines slide apart into two lanes and each lane is an ordinary write."
alt = "The twenty lines separate into two horizontal lanes. CPU 2 keeps two whole writes that open and close inside the window, CPU 4 keeps one that opened before the window started, and neither was ever inside the other."
shows = ["cpu-lane", "trace-cell"]

[[beat]]
seconds = 12
caption = "There is one ring buffer per CPU, and reading the file merges all six."
alt = "Six separate ring buffers, one per CPU, feeding into the single file the reader started with, which is where the interleaving comes from and why it changes 33 times in 305 lines."
shows = ["cpu-lane"]

[[beat]]
seconds = 10
caption = "So indentation belongs to a CPU. One call stack per CPU, never one per file."
alt = "The lanes stay separate and the closing line of text repeats the rule, with the six lanes still visible underneath it."
shows = ["cpu-lane"]
