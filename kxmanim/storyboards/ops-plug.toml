id = "ops-plug"
idea = "The VFS never knew how to write to your filesystem, it followed a pointer"
still = "lessons/S05/assets/one-write-three-tables.svg"
status = "draft"

# The split at the end of this is recorded now. `corpora/traces/tier0/two-writes.txt` is one tracer
# window with two writes in it, one to a file on tmpfs and one to a pipe, and both trees start at
# `vfs_write` and go different ways one call down. The last two beats read their names off that
# capture rather than out of the kernel source, which is also how the wrong name in the old version
# of this file got found: the pipe write is `anon_pipe_write`, not `pipe_write`.
inputs = ["corpora/traces/tier0/two-writes.txt"]
evidence = true

[[beat]]
seconds = 10
caption = "One program, one write call, one byte. Nothing here says which filesystem."
alt = "A single frame card labelled write of fd, one byte, sitting on its own with an arrow pointing down into the kernel, and no filesystem named anywhere on screen."
shows = ["frame-card"]

[[beat]]
seconds = 10
caption = "It lands in vfs_write, which is the same code for every file on the machine."
alt = "A second frame card labelled vfs_write in fs slash read_write dot c appears under the first one, in the filesystem colour, with a note that this one function handles every write on the machine."
shows = ["frame-card", "context-badge"]

[[beat]]
seconds = 14
caption = "Open the file it was handed. One field in it is a pointer to a table."
alt = "An object box for struct file opens beside the cards, showing a few of its fields with their byte offsets, and the row named f_op is highlighted while the rest stay grey."
shows = ["object-box"]

[[beat]]
seconds = 14
caption = "The pointer was written at open time, copied out of the inode, and never changed."
alt = "A solid pointer thread runs from the f_op row of struct file across to a table, labelled owning, with a note that the copy happened once when the file was opened and every later call follows the same line."
shows = ["object-box", "pointer-thread"]

[[beat]]
seconds = 16
caption = "The table is a column of sockets, and most of them are empty."
alt = "An ops plug for struct file_operations, drawn as a column of named sockets with their byte offsets. A handful are filled and shaded, the rest are hollow, and a count underneath says how many of each."
shows = ["ops-plug"]

[[beat]]
seconds = 12
caption = "Change the file and the same socket holds different code. That is the whole trick."
alt = "The ops plug swaps from shmem_file_operations to pipefifo_fops, with the write_iter socket keeping its position and its byte offset while the name plugged into it changes from shmem_file_write_iter to anon_pipe_write."
shows = ["ops-plug", "pointer-thread"]

[[beat]]
seconds = 12
caption = "Here are both of those writes, recorded one after the other, in one capture."
alt = "Two trace cells from the same function graph capture sit side by side, each opening on vfs_write and each showing a different name one line in, shmem_file_write_iter on the left and anon_pipe_write on the right, with only the right hand tree ending in a wakeup."
shows = ["trace-cell", "ops-plug"]
