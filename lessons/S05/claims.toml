schema = 1
lesson = "S05"

# The three source claims are verified. Their citations resolve against the pinned 7.2.2 tree,
# which `./kxbox/kernel/tree.sh` unpacks, and refcheck refuses to let a claim say verified against
# a citation nobody has resolved.
#
# S05-05 changed while that was being done, and it is worth saying why. It used to cite the
# file_operations section of Documentation/filesystems/vfs.rst for the idea that most slots may be
# left empty. That section lists the members and describes each one, and it never says that. The
# claim now says the narrower thing the code actually shows, and cites the code.
#
# Two more are settled the moment a reader runs the lesson, because they are counts taken off the
# reader's own kernel. The last one wants a capture, which wants kxbox to boot.
#
# `pending` says what will settle each claim. It is a note to the next person, not a field the
# ledger reads.

[[claims]]
id = "S05-01"
text = "The VFS does not know how to write to any filesystem. It reads a function pointer out of the open file and calls whatever is in it, so the filesystem chose the code that runs and the VFS only chose the slot."
evidence_kind = "source"
evidence = "S05-R1"
verified = true

[[claims]]
id = "S05-02"
text = "The pointer is put there when the file is opened, copied out of the inode, so the implementation is chosen once at open time and every later call follows the same pointer."
evidence_kind = "source"
evidence = "S05-R2"
verified = true

[[claims]]
id = "S05-03"
text = "A running kernel holds hundreds of ops tables, and they can be counted by name in the kernel symbol table without root and without anything installed."
evidence_kind = "experiment"
pending = "the reader runs the counting cell against their own /proc/kallsyms and reads the number"
verified = false

[[claims]]
id = "S05-04"
text = "Most ops tables sit in the kernel's read only data section, which is what const looks like from outside, so one table is shared by every object that uses it rather than copied into each one."
evidence_kind = "experiment"
pending = "the reader counts the section letters on their own machine and sees the ratio"
verified = false

[[claims]]
id = "S05-05"
text = "The caller checks a slot before it calls it, so a file whose table never filled in either write slot comes back from write(2) with an error rather than jumping through a null pointer."
evidence_kind = "source"
evidence = "S05-R3"
verified = true

[[claims]]
id = "S05-06"
text = "Two writes of the same size to two different kinds of file run different kernel functions underneath the same vfs_write, and the names of those functions say which table was plugged in."
evidence_kind = "trace"
pending = "a function_graph capture of a write to a regular file and a write to a pipe, taken from the browser once kxbox boots"
verified = false
