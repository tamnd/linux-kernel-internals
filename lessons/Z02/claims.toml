schema = 1
lesson = "Z02"

# All six are settled.
#
# The two source claims resolve against the pinned 7.2.2 tree, which `./kxbox/kernel/tree.sh`
# unpacks, and refcheck refuses to let a claim say verified against a citation nobody has resolved.
#
# The other four each needed something to be built first, and this is what each one took.
#
# Z02-05 needed a capture of one write and nothing else, which meant a program in the image that
# turns the tracer on around a single `write` and turns it off again. `dd` cannot do that and no
# shell one liner can either.
#
# Z02-04 needed a ring buffer small enough to overflow on purpose, which is one write to
# `buffer_size_kb` and then any ordinary work at all.
#
# Z02-03 and Z02-06 could not be settled on Tier 0 at any price. One needs more than one CPU and
# v86 is a uniprocessor emulator. The other needs a clock and v86 does not have one. Both are
# captures off a real Linux machine, filed under `tier1` with metadata saying exactly which
# machine, and both are about behaviour that does not depend on the architecture.

[[claims]]
id = "Z02-01"
text = "With the function_graph tracer on, the kernel writes a line when a function is entered and a line when it returns, and a function that calls nothing gets a single line with its duration."
evidence_kind = "source"
evidence = "Z02-R1"
verified = true

[[claims]]
id = "Z02-02"
text = "The character before the duration is a slowness marker, and the kernel prints the marker instead of the threshold: + is over 10 us, ! is over 100 us, # is over 1000 us, * is over 10 ms, @ is over 100 ms, and $ is over 1 s."
evidence_kind = "source"
evidence = "Z02-R2"
verified = true

[[claims]]
id = "Z02-03"
text = "The trace file holds the output of every CPU in one stream, so indentation belongs to a CPU and not to the file, and two lines next to each other can come from two different call stacks."
evidence_kind = "trace"
evidence = "corpora/traces/tier1/multi-cpu-write.txt"
verified = true
why_not_pinned = "v86 is a uniprocessor emulator, so a trace with more than one CPU in it cannot be captured on Tier 0 at any price or with any amount of work. The claim is about how one trace file interleaves the output of several CPUs, which is the same on every architecture and on every kernel that has this tracer."
# Six CPUs, six writers, released together. The CPU column changes 33 times in 305 lines, and at
# lines 187 to 206 two CPUs alternate almost line by line while both are part way through their
# own call. Read that stretch as one stack and it is nonsense.

[[claims]]
id = "Z02-04"
text = "The buffer behind the trace file is a ring, so a trace that runs for long enough loses its oldest lines, and the count of what was lost is in the per CPU stats file rather than in the trace."
evidence_kind = "proc"
evidence = "corpora/proc/tier0/ring-overrun.txt"
verified = true
# 273 events kept, 44002 thrown away, in seven milliseconds of tracing an `ls`. The trace file says
# nothing about it. It just starts part way through and looks complete.

[[claims]]
id = "Z02-05"
text = "Writing one byte to a file enters the kernel at the write system call and reaches the filesystem through vfs_write, and the work underneath that is where the time goes."
evidence_kind = "trace"
evidence = "corpora/traces/tier0/write-1byte.txt"
verified = true
# One write, on the pinned kernel, with nothing else in the window. The file is one nothing had
# written to yet, so the trace shows the page being allocated as well as the byte being copied.

[[claims]]
id = "Z02-06"
text = "Tracing every function costs the traced work real time, so the same write measured with the tracer on takes longer than with it off."
evidence_kind = "experiment"
evidence = "corpora/experiments/tier1/tracer-cost.txt"
verified = true
why_not_pinned = "v86 has no clock you can measure with, so a claim about how long something takes has to be measured somewhere else. The claim is that tracing costs the traced work real time rather than that it costs any particular number of nanoseconds, and the reader is told to run the same thing on their own machine and get their own figure."
# About 257 nanoseconds a write untraced and about 6619 with function_graph on, which is roughly
# twenty five times. Measured on a real machine, because Tier 0 has no clock to measure with. The
# reader can run the same thing on their own machine and should get their own numbers.
