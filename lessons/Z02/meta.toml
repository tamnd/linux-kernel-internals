id = "Z02"
title = "Your first trace"
part = "Z"
status = "draft"

# What the lesson is written against. A kernel claim with no configuration attached is not a
# claim, so this block is not optional and refcheck reads it.
#
# The profile is the one from kxbox/kernel/pin.toml, which is where the version, the architecture
# and the config fragments all live together. Naming the profile gets all of them at once, and it
# means a profile that gets renamed fails a check rather than leaving this pointing at a build
# nobody makes any more.
kernel = "7.2.2"
arch = "x86"
profile = "A-full"

# Tier 0 is the browser kernel under v86. Uniprocessor, 32 bit, emulated timing.
tier = 0

# Why this is still a draft. The lesson is written and all six of its claims are verified: four
# against captures in `corpora/` and two against anchors in the pinned tree. What is left is a
# person reading it end to end, which is not a check a script can pass.
#
# Two of those claims are backed by Tier 1 captures rather than Tier 0 ones, because Tier 0 has one
# CPU and no clock and neither of those is fixable. The captures say which machine they came off.
blocked_on = "review"
