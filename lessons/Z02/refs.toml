# Citations into the pinned kernel tree.
#
# These are confirmed against the pinned tree. Unpack it with `./kxbox/kernel/tree.sh` and run
# `python3 -m tools.refcheck --tree kxbox/kernel/build/tree/linux-7.2.2 --confirm`, which finds
# the anchor, writes down the line it is on and flips the flag. Only a confirmed citation can back
# a claim marked verified, and refcheck is what enforces that.
#
# The anchor is a piece of text to find, never a line number. A line number is right on the day it
# is typed and wrong after the next patch, and the wrongness is silent, because a stale line number
# still points at a line. An anchor that matches twice is rejected for the same reason.

