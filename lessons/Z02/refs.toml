# Citations into the pinned kernel tree.
#
# None of these are confirmed, and that is the honest state rather than an oversight. Confirming
# one means running `python3 -m tools.refcheck --tree <a real linux tree> --confirm`, which finds
# the anchor, writes down the line it is on and flips the flag. There is no kernel tree on the
# machine this was written on, so nobody has done that yet, and until somebody does these cannot
# verify anything.
#
# The anchor is a piece of text to find, never a line number. A line number is right on the day it
# is typed and wrong after the next patch, and the wrongness is silent, because a stale line number
# still points at a line.

