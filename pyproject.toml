[project]
name = "linux-kernel-internals"
version = "0.0.0"
description = "A visual teardown of the Linux kernel, with a real kernel booting in your browser"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
# Everything needed to run the checkers and the tests. Kept separate from the
# notebook and site dependencies so CI installs the small set.
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
]

[project.scripts]
lintprose = "tools.lintprose.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# kxbox and kxmanim get added here as each one lands.
packages = ["kxdraw", "kxray", "kxwidgets", "tools"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
# The notebooks are generated from the build.py beside them. Linting output is linting the wrong
# file, and the cell sources carry notebook magics that are not Python.
extend-exclude = ["*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Tests say the same thing several ways on purpose.
"tests/*" = ["E501"]
# A lesson builder holds the lesson prose, and the house rule is that a paragraph is one line, so
# every paragraph in it is over the limit by design.
"lessons/*/build.py" = ["E501"]
