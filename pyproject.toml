[project]
name = "linux-kernel-internals"
version = "0.0.0"
description = "A visual teardown of the Linux kernel, with a real kernel booting in your browser"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
# Everything needed to run the checkers and the tests. Kept separate from the
# notebook and site dependencies so CI installs the small set.
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
]

# Rendering animations, and nothing else. This is not in `dev` and it is not in CI on purpose.
# manim pulls in cairo, pango and a video encoder, which is several minutes of install on every
# push to check something no push changes. Everything except the render itself, including the
# storyboard rules and all nine primitives, works without any of it.
animation = [
  "manim>=0.18",
]

# The published book. Not in `dev` and not in the fast CI job, for the same reason as animation:
# the theme and the notebook renderer are a slow install to check something most pushes do not
# touch. Everything except the render, including the navigation and the staging, works without it.
# Held below MkDocs 2.0 deliberately. 2.0 removes the plugin system, and the notebook renderer
# that turns a lesson into a page is a plugin. Moving up is a decision with work attached, not
# something that should happen on its own in a CI run one morning.
site = [
  "mkdocs>=1.6,<2",
  "mkdocs-material>=9.5,<10",
  "mkdocs-jupyter>=0.25",
]

[project.scripts]
lintprose = "tools.lintprose.__main__:main"
kxmanim = "kxmanim.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["kxbox", "kxdiff", "kxdraw", "kxmanim", "kxray", "kxwidgets", "tools"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
# The notebooks are generated from the build.py beside them. Linting output is linting the wrong
# file, and the cell sources carry notebook magics that are not Python.
extend-exclude = ["*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Tests say the same thing several ways on purpose.
"tests/*" = ["E501"]
# A lesson builder holds the lesson prose, and the house rule is that a paragraph is one line, so
# every paragraph in it is over the limit by design.
"lessons/*/build.py" = ["E501"]
# Same reason: the site builder holds the prose of the two index pages, one paragraph per line.
"tools/sitebuild.py" = ["E501"]
# The programs the page hands to Pyodide are not modules and are never imported. They are source
# text passed to `runPythonAsync`, which wraps them in a coroutine, so top level `await` is allowed
# there and only there. Ruff is right about every other file and wrong about these two.
"kxbox/web/*.py" = ["F704"]
